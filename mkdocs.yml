site_name: Rezflix Help
site_url: https://help.rezflixtv.com/
site_description: Help center for Rezflix users.
docs_dir: docs/en
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Apps:
      - apps/index.md
  - Settings: settings.md
  - How to request: requesting.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Contact: contact.md

extra_css:
  - assets/stylesheets/rezflix.css

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Türkçe
      link: /tr/
      lang: tr

validation:
  anchors: warn

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
